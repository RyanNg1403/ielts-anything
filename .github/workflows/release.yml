name: Release

# Push a tag that matches package.json, e.g. `git tag v0.0.1 && git push origin v0.0.1`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($version)." >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      # Trusted publishing: npm verifies this workflow's GitHub OIDC token, so no npm token is stored.
      # prepack builds the web app and the CLI bundle.
      - run: npm publish --provenance --access public
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of CHANGELOG.md, without its heading.
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " { if (found) exit; if (index($0, v)) { found = 1; next } } found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
